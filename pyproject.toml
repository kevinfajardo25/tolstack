[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tolstack"
version = "0.1.0"
description = "1D tolerance stack-up analysis: worst case, RSS and Monte Carlo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tolstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
